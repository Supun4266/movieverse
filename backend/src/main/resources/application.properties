spring.application.name=backend
server.port=8080

# ---------- Database ----------
# H2 saves data in a file (backend/data/), so movies and users are still there after a restart.
# No database install needed. To use PostgreSQL later, change these 3 lines.
spring.datasource.url=jdbc:h2:file:./data/movieverse
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Kafka ----------
# Start Kafka first with: docker compose up -d   (from the movieverse folder)
# Set movieverse.kafka.enabled=false to run without Kafka (Trending Now will then stay empty).
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.properties.max.block.ms=3000
movieverse.kafka.enabled=true
movieverse.kafka.topic=movie-watched

# ---------- Security ----------
# Secret used to sign login tokens. Must be at least 32 characters.
# In a real deployment, set it with the MOVIEVERSE_JWT_SECRET environment variable instead.
movieverse.jwt.secret=${MOVIEVERSE_JWT_SECRET:dev-only-secret-change-me-please-0123456789}

# The React app's address (allowed to call this API from the browser)
movieverse.cors.allowed-origins=http://localhost:5173
