spring.application.name=trending-service
server.port=8081

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=localhost:9092
movieverse.kafka.topic=movie-watched

# Counts are kept in memory. A fresh group id + "earliest" means that every time this
# service starts, it re-reads ALL old events from Kafka and rebuilds the counts.
# (Kafka keeps the event history, so nothing is lost when this service restarts.)
spring.kafka.consumer.group-id=trending-service-${random.uuid}
spring.kafka.consumer.auto-offset-reset=earliest

# The React app's address (allowed to call this API from the browser)
movieverse.cors.allowed-origins=http://localhost:5173
